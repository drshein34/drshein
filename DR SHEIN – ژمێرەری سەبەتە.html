<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DR SHEIN – ژمێرەری سەبەتە</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blush:#FFDDE7; --rose:#E8789A; --rose-deep:#C94F78; --ink:#1B1316; --gold:#B98A4E; --paper:#FFF8FA; --line:#F3B7C9;
  --sans:"Noto Sans Arabic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);min-height:100%;background:var(--blush)}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,#FDD1DE 0%,var(--blush) 38%,#FFEAF0 100%);color:var(--ink);font-family:var(--sans);-webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto;padding:6px 16px 280px}
.logo{display:block;width:min(250px,64vw);height:auto;margin:0 auto;
  -webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 62%,transparent 100%);
  mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 62%,transparent 100%)}
h1{font-family:var(--sans);font-weight:800;font-size:1.6rem;text-align:center;margin:2px 0 2px;letter-spacing:0;line-height:1.5}
.sub{text-align:center;margin:0 0 18px;color:var(--rose-deep);font-size:.95rem}
.cols{display:grid;grid-template-columns:34px 1fr 16px 1fr 30px;gap:6px;padding:0 2px 8px;font-size:.78rem;color:var(--rose-deep);font-weight:700;align-items:end}
.cols span{text-align:center;line-height:1.4}
.list{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.row{display:grid;grid-template-columns:34px 1fr 16px 1fr 30px;gap:6px;align-items:center}
.num{width:30px;height:30px;border-radius:50%;background:var(--rose);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.9rem;justify-self:center}
.in{position:relative}
.in b{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-family:var(--serif);font-size:1.15rem;color:var(--gold);pointer-events:none}
.in input{width:100%;height:54px;border:1.5px solid var(--line);border-radius:16px;background:var(--paper);padding:0 8px 0 30px;direction:ltr;text-align:left;font:600 1.15rem var(--sans);color:var(--ink);font-variant-numeric:tabular-nums;outline:none;transition:border-color .15s,box-shadow .15s}
.in input::placeholder{color:#E3B2C2;font-weight:500}
.in input:focus-visible{border-color:var(--rose);box-shadow:0 0 0 4px rgba(232,120,154,.25)}
.eq{text-align:center;color:var(--gold);font-weight:700;font-size:1.1rem}
.out{height:54px;border-radius:16px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;direction:ltr;padding:0 6px;font-weight:700;font-size:1.1rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.out.empty{background:rgba(27,19,22,.08);color:#C79BAB}
.rm{width:30px;height:30px;border:0;border-radius:50%;background:transparent;color:var(--rose-deep);font-size:1.3rem;line-height:1;cursor:pointer;display:grid;place-items:center}
.rm:hover{background:rgba(201,79,120,.12)}
.rm:focus-visible,.btn:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.actions{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;height:50px;border-radius:16px;font:600 1rem var(--sans);cursor:pointer;border:1.5px solid var(--rose)}
.btn.add{background:var(--rose);color:#fff}
.btn.add:active{background:var(--rose-deep)}
.btn.clear{flex:0 0 auto;padding:0 20px;background:transparent;color:var(--rose-deep)}
.bar{position:fixed;left:12px;right:12px;bottom:calc(22px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:16px 20px 18px;border-radius:28px;border:2px solid var(--gold);box-shadow:0 12px 34px rgba(120,30,60,.35)}
.bar-in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;align-items:stretch;gap:4px}
.lbl{display:flex;justify-content:space-between;align-items:baseline;font-size:1.15rem;font-weight:800;color:#fff}
.lbl em{display:block;font-style:normal;font-weight:600;color:var(--gold);font-size:.9rem;margin-top:0}
.total{font-family:var(--serif);font-weight:700;font-size:3.1rem;line-height:1.1;justify-content:center;font-variant-numeric:lining-nums tabular-nums;color:#fff}
.total span:last-child{font:700 1.15rem var(--sans);color:var(--gold);margin-inline-start:10px}
.total{direction:ltr;display:flex;align-items:baseline;flex-direction:row-reverse}
.foot{margin-top:26px;text-align:center;font-size:.8rem;color:var(--rose-deep);opacity:.85}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:360px){.out{font-size:.98rem}.in input{font-size:1.05rem}.total{font-size:2.5rem}}
</style>
</head>

  <h1>سەبەتە</h1>
  <p class="sub">نرخی هەر کاڵایەک بە دۆلار بنووسە</p>

  <div class="cols" aria-hidden="true"><span>کاڵا</span><span>نرخی کاڵا لە شیئین</span><span></span><span>نرخی کاڵا بە دیناری عێراقی</span><span></span></div>
  <ul class="list" id="list"></ul>

  <div class="actions">
    <button class="btn add" id="add" type="button">+ کاڵا زیادبکە</button>
    <button class="btn clear" id="clear" type="button">سڕینەوە</button>
  </div>
  <p class="foot">DR SHEIN</p>
</main>

<div class="bar" role="status" aria-live="polite">
  <div class="bar-in">
    <div class="lbl">کۆی گشتی سەبەتە<em id="count">0 کاڵا</em></div>
    <div class="total"><span id="total">0</span><span>دینار</span></div>
  </div>
</div>

<script>
(function(){
  var list=document.getElementById('list'), totalEl=document.getElementById('total'), countEl=document.getElementById('count');
  var START_ROWS=3;

  function toDinar(text){
    var s=String(text).replace(/[٠-٩]/g,function(d){return d.charCodeAt(0)-1632}).replace(/[۰-۹]/g,function(d){return d.charCodeAt(0)-1776}).replace(/[,،٫]/g,'.').replace(/[^0-9.]/g,'');
    var v=parseFloat(s);
    if(!isFinite(v)||v<=0) return null;
    var cents=Math.round(v*100);
    return Math.ceil((cents*1380+50000)/25000)*250;
  }
  function fmt(n){return n.toLocaleString('en-US')}

  function recalc(){
    var sum=0,n=0;
    list.querySelectorAll('.row').forEach(function(r,i){
      r.querySelector('.num').textContent=i+1;
      var out=r.querySelector('.out'), d=toDinar(r.querySelector('input').value);
      if(d===null){out.className='out empty';out.innerHTML='—';}
      else{out.className='out';out.textContent=fmt(d);sum+=d;n++;}
    });
    totalEl.textContent=fmt(sum);
    countEl.textContent=n+' کاڵا';
  }

  function addRow(focus){
    var li=document.createElement('li');
    li.className='row';
    li.innerHTML='<div class="num" aria-hidden="true"></div><label class="in"><b>$</b><input type="text" dir="ltr" inputmode="decimal" autocomplete="off" placeholder="0" aria-label="نرخی کاڵا بە دۆلار" maxlength="9"></label>'+
      '<div class="eq" aria-hidden="true">=</div><div class="out empty" aria-label="نرخی کاڵا بە دینار">—</div>'+
      '<button class="rm" type="button" aria-label="سڕینەوەی کاڵا">×</button>';
    var input=li.querySelector('input');
    input.addEventListener('input',recalc);
    input.addEventListener('keydown',function(e){
      if(e.key==='Enter'){
        e.preventDefault();
        var next=li.nextElementSibling;
        if(!next){addRow(true);} else {next.querySelector('input').focus();}
      }
    });
    li.querySelector('.rm').addEventListener('click',function(){
      li.remove();
      if(!list.children.length) addRow(false);
      recalc();
    });
    list.appendChild(li);
    recalc();
    if(focus) input.focus();
  }

  document.getElementById('add').addEventListener('click',function(){addRow(true)});
  document.getElementById('clear').addEventListener('click',function(){
    list.innerHTML='';
    for(var i=0;i<START_ROWS;i++) addRow(false);
    recalc();
  });
  for(var i=0;i<START_ROWS;i++) addRow(false);
})();
</script>
</body>
</html>
